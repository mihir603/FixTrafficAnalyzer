spring.application.name=fix-batch-service

# Local-first: everything stays on this machine. Default profile = embedded H2 (no Docker needed).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${SERVER_PORT:8080}

# Never auto-launch anything at startup; imports are explicit (upload or path import).
# Synthetic demo captures (safe to commit) live in ./samples - regenerate with scripts/generate_demo_fix.py
fix.traffic.path=${FIX_TRAFFIC_PATH:samples/Fix_traffic_demo_india.txt}

# File uploads (multipart)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# SQL init runs the (idempotent) schema on every boot for the active datasource
spring.sql.init.mode=always

# Replay: cap on real sleep between messages in realtime mode (long capture gaps are shortened)
fix.replay.max-gap-ms=2000
