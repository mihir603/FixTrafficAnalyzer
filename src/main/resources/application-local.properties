# Local profile: embedded in-memory H2 database - zero dependencies, no DB files on disk.
# Fresh empty DB each start; import the demo sample via the "Import demo" button.
# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL must match below)

spring.datasource.url=jdbc:h2:mem:fixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No docker / postgres on the local profile
spring.docker.compose.enabled=false

# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL must match above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console